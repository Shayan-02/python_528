<div class="col-md-6 col-xl-4">
  <article class="blog-card h-100">
    <a class="blog-card-image" href="{{ post.get_absolute_url }}" aria-label="مطالعه {{ post.title }}">
      {% if post.featured_image %}
        <img src="{{ post.featured_image.url }}" alt="{{ post.title }}" loading="lazy">
      {% else %}
        <span class="blog-image-placeholder"><i class="bi bi-journal-richtext"></i></span>
      {% endif %}
    </a>
    <div class="blog-card-body">
      {% if post.category %}<a class="blog-category" href="{{ post.category.get_absolute_url }}">{{ post.category.name }}</a>{% endif %}
      <h2 class="blog-card-title"><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></h2>
      {% if post.excerpt %}<p class="blog-card-excerpt">{{ post.excerpt }}</p>{% endif %}
      <div class="blog-card-meta">
        <span><i class="bi bi-calendar3"></i> {{ post.published_at|date:"d F Y" }}</span>
        <span><i class="bi bi-eye"></i> {{ post.views }}</span>
      </div>
      <a class="blog-read-more" href="{{ post.get_absolute_url }}">ادامه مطلب <i class="bi bi-arrow-left"></i></a>
    </div>
  </article>
</div>
