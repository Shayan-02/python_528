{% extends "base.html" %}
{% block title %}ثبت‌نام | آینده شاپ{% endblock %}
{% block content %}
<div class="auth-card"><h1 class="h4 mb-4">ایجاد حساب کاربری</h1>
<form method="post">{% csrf_token %}
  {% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}
  <button class="btn btn-primary w-100">ثبت‌نام</button>
</form><p class="mt-3 mb-0 text-center">قبلاً ثبت‌نام کرده‌اید؟ <a href="{% url 'accounts:login' %}">وارد شوید</a></p>
</div>
{% endblock %}
