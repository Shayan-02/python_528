{% if page_obj.has_other_pages %}<nav class="cms-pagination" aria-label="صفحه‌بندی"><span>صفحه {{ page_obj.number }} از {{ page_obj.paginator.num_pages }}</span><div>{% if page_obj.has_previous %}<a href="?{% if request.GET.urlencode %}{{ request.GET.urlencode }}&{% endif %}page={{ page_obj.previous_page_number }}" aria-label="صفحه قبل"><i class="bi bi-chevron-right"></i></a>{% endif %}{% if page_obj.has_next %}<a href="?{% if request.GET.urlencode %}{{ request.GET.urlencode }}&{% endif %}page={{ page_obj.next_page_number }}" aria-label="صفحه بعد"><i class="bi bi-chevron-left"></i></a>{% endif %}</div></nav>{% endif %}
