{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود مدیر | آینده‌شاپ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'dashboard/css/dashboard.css' %}" rel="stylesheet">
</head>
<body class="cms-login-body">
  <main class="cms-login-card">
    <div class="cms-login-logo"><i class="bi bi-bag-check-fill"></i></div>
    <div class="text-center mb-4"><h1>ورود به پنل مدیریت</h1><p>مدیریت فروشگاه و محتوای آینده‌شاپ</p></div>
    {% if form.errors %}<div class="alert alert-danger">نام کاربری یا رمز عبور صحیح نیست.</div>{% endif %}
    {% if next %}<div class="alert alert-info">برای مشاهده این بخش، ابتدا وارد حساب مدیریتی شوید.</div>{% endif %}
    <form method="post" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3"><label for="id_username" class="form-label">نام کاربری</label><input id="id_username" name="username" class="form-control" autocomplete="username" required autofocus></div>
      <div class="mb-4"><label for="id_password" class="form-label">رمز عبور</label><input id="id_password" name="password" type="password" class="form-control" autocomplete="current-password" required></div>
      <button class="btn btn-primary w-100 py-2" type="submit">ورود به پنل <i class="bi bi-arrow-left-short"></i></button>
    </form>
    <a href="{% url 'core:home' %}" class="cms-login-back"><i class="bi bi-arrow-right"></i> بازگشت به فروشگاه</a>
  </main>
</body>
</html>
