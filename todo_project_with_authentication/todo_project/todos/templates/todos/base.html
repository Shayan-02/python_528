<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Todos{% endblock %}</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --danger:#dc2626; --ok:#16a34a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111418; --card:#1a1e24; --text:#e6e8eb; --muted:#9aa3af; --line:#2a2f37; --accent:#60a5fa; --danger:#f87171; --ok:#4ade80; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    main { max-width:640px; margin:0 auto; padding:24px 16px 64px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:22px; }
    .topbar .account { color:var(--muted); font-size:.9rem; }
    .topbar form { margin:0; }
    .topbar button { font:inherit; cursor:pointer; }
    .topbar .btn { font-size:.85rem; }
    h1 { font-size:1.6rem; margin:0 0 4px; }
    .sub { color:var(--muted); margin:0 0 20px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
    input[type=text], input[type=date], textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
    .row { display:flex; gap:8px; align-items:center; }
    .btn { border:0; border-radius:8px; padding:9px 14px; font:inherit; cursor:pointer; background:var(--accent); color:#fff; text-decoration:none; display:inline-block; }
    .btn.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
    .btn.danger { background:transparent; color:var(--danger); border:1px solid var(--line); }
    .btn.small { padding:5px 10px; font-size:.85rem; }
    .tabs { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
    .tabs a { padding:5px 12px; border-radius:999px; border:1px solid var(--line); color:var(--muted); text-decoration:none; font-size:.9rem; }
    .tabs a.on { background:var(--accent); color:#fff; border-color:var(--accent); }
    ul { list-style:none; margin:0; padding:0; }
    li.todo { display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line); }
    li.todo:last-child { border-bottom:0; }
    li.todo .body { flex:1; min-width:0; }
    li.todo .title { font-weight:500; word-break:break-word; }
    li.todo.done .title { text-decoration:line-through; color:var(--muted); }
    .meta { font-size:.85rem; color:var(--muted); }
    .overdue { color:var(--danger); }
    .check { width:24px; height:24px; border-radius:50%; border:2px solid var(--line); background:transparent; cursor:pointer; padding:0; color:#fff; flex-shrink:0; margin-top:2px; }
    li.done .check { background:var(--ok); border-color:var(--ok); }
    .actions { display:flex; gap:6px; }
    .msg { background:var(--card); border:1px solid var(--ok); color:var(--ok); border-radius:8px; padding:8px 12px; margin-bottom:12px; }
    .errorlist { color:var(--danger); list-style:none; padding:0; margin:4px 0; font-size:.9rem; }
    label { display:block; margin:10px 0 4px; font-size:.9rem; color:var(--muted); }
    .empty { text-align:center; color:var(--muted); padding:24px 0; }
  </style>
</head>
<body>
<main>
  {% if user.is_authenticated %}
  <header class="topbar">
    <div class="account">Signed in as <strong>{{ user.username }}</strong></div>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button class="btn ghost" type="submit">Log out</button>
    </form>
  </header>
  {% endif %}
  {% for message in messages %}<div class="msg">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
