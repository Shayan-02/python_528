{% extends 'blog/base.html' %}

{% block title %}{{ post.title }} | Django Blog{% endblock %}

{% block content %}
<article class="post-detail">
    <div class="post-detail-head">
        <span class="badge">پست آموزشی</span>
        <h1>{{ post.title }}</h1>
        <div class="meta-row">
            <span>نویسنده: {{ post.author.username }}</span>
            <span>تاریخ: {{ post.created_at|date:'Y/m/d H:i' }}</span>
        </div>
    </div>

    <div class="post-body">
        {{ post.body|linebreaks }}
    </div>

    <div class="back-row">
        <a class="button button-light" href="{% url 'blog:post_list' %}">← بازگشت به پست‌ها</a>
    </div>
</article>
{% endblock %}
